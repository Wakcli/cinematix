[package]
name = "cinematix-editor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cinematix-anim = { path = "../cinematix-anim" }
cinematix-scene = { path = "../cinematix-scene" }
cinematix-timeline = { path = "../cinematix-timeline" }
cinematix-ui = { path = "../cinematix-ui" }
glam = { version = "0.30", features = ["serde"] }
horizon-client-render = { path = "../horizon-client-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
